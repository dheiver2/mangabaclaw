parent_config: ../../config/swiftlint.yml

included:
  - Sources
  - ShareExtension
  - ActivityWidget
  - WatchApp
  - ../shared/MangabaClawKit/Sources/MangabaClawChatUI
  - ../shared/MangabaClawKit/Sources/MangabaClawKit
  - ../shared/MangabaClawKit/Sources/MangabaClawNativeState
  - ../shared/MangabaClawKit/Sources/MangabaClawProtocol
  - ../swabble/Sources/SwabbleKit

excluded:
  - ../macos
  - ../macos-mlx-tts
  - ../shared/MangabaClawKit/Sources/MangabaClawProtocol/GatewayModels.swift

type_body_length:
  warning: 900
  error: 1300

custom_rules:
  mangabaclaw_design_colors:
    name: "MangabaClaw design colors"
    excluded:
      - Sources/Design/MangabaClawBrand.swift
      - ../shared/MangabaClawKit/Sources/MangabaClawChatUI/ChatTheme.swift
    regex: '(Color\.accentColor|(^|[^A-Za-z0-9_])\.accentColor\b|Color\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|\.(foregroundStyle|tint|fill|stroke|strokeBorder|background)\(\s*\.(red|green|orange|cyan|blue|yellow|purple|pink)\b|Color\(red:\s*0\s*/\s*255\.0,\s*green:\s*122\s*/\s*255\.0,\s*blue:\s*255\s*/\s*255\.0\))'
    message: "Use MangabaClawBrand or MangabaClawChatTheme design tokens instead of raw accent/status colors."
    severity: error
