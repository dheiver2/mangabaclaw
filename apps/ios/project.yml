name: MangabaClaw
options:
  bundleIdPrefix: ai.mangabaclawfoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  MangabaClawKit:
    path: ../shared/MangabaClawKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  MangabaClaw:
    shared: true
    build:
      targets:
        MangabaClaw: all
    test:
      targets:
        - MangabaClawTests
        - MangabaClawLogicTests
  MangabaClawLogicTests:
    shared: true
    build:
      targets:
        MangabaClawLogicTests: all
    test:
      targets:
        - MangabaClawLogicTests
  MangabaClawUITests:
    shared: true
    build:
      targets:
        MangabaClawUITests: all
    test:
      targets:
        - MangabaClawUITests
  MangabaClawWatchApp:
    shared: true
    build:
      targets:
        MangabaClawWatchApp: all

targets:
  MangabaClaw:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: MangabaClawShareExtension
        embed: true
      - target: MangabaClawActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: MangabaClawWatchApp
      - package: MangabaClawKit
      - package: MangabaClawKit
        product: MangabaClawChatUI
      - package: MangabaClawKit
        product: MangabaClawProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftformat
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/MangabaClawKit/Sources/MangabaClawChatUI,$SRCROOT/../shared/MangabaClawKit/Sources/MangabaClawKit,$SRCROOT/../shared/MangabaClawKit/Sources/MangabaClawNativeState,$SRCROOT/../shared/MangabaClawKit/Sources/MangabaClawProtocol,$SRCROOT/../swabble/Sources/SwabbleKit" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftlint
          swiftlint lint --strict --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(MANGABACLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(MANGABACLAW_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(MANGABACLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
        MANGABACLAW_ACTIVE_APP_GROUP_ID: "$(MANGABACLAW_APP_GROUP_ID)"
        MANGABACLAW_URL_SCHEME: mangabaclaw
        PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(MANGABACLAW_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          MANGABACLAW_ACTIVE_APP_GROUP_ID: "$(MANGABACLAW_DEBUG_APP_GROUP_ID)"
          MANGABACLAW_CODE_SIGN_ENTITLEMENTS: Sources/MangabaClaw.entitlements
          MANGABACLAW_APNS_ENTITLEMENT_ENVIRONMENT: development
          MANGABACLAW_URL_SCHEME: mangabaclaw-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          MANGABACLAW_PUSH_MODE: localSandbox
          MANGABACLAW_PUSH_RELAY_BASE_URL: ""
        Release:
          MANGABACLAW_CODE_SIGN_ENTITLEMENTS: Sources/MangabaClaw.entitlements
          MANGABACLAW_APNS_ENTITLEMENT_ENVIRONMENT: production
          MANGABACLAW_PUSH_MODE: localProduction
          MANGABACLAW_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MangabaClaw
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.mangabaclawfoundation.app
            CFBundleURLSchemes:
              - "$(MANGABACLAW_URL_SCHEME)"
        CFBundleShortVersionString: "$(MANGABACLAW_MARKETING_VERSION)"
        MangabaClawCanonicalVersion: "$(MANGABACLAW_IOS_VERSION)"
        MangabaClawGitCommit: "$(MANGABACLAW_GIT_COMMIT)"
        MangabaClawBuildTimestamp: "$(MANGABACLAW_BUILD_TIMESTAMP)"
        MangabaClawAppGroupIdentifier: "$(MANGABACLAW_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(MANGABACLAW_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: MangabaClaw discovers and connects to your MangabaClaw gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _mangabaclaw-gw._tcp
        NSCameraUsageDescription: MangabaClaw uses the camera when you scan a Gateway setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: MangabaClaw uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: MangabaClaw uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: MangabaClaw uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: MangabaClaw uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: MangabaClaw uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: MangabaClaw can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: MangabaClaw uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: MangabaClaw may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: MangabaClaw reads your steps, sleep, resting heart rate, and workouts from the Apple Health app to create summaries you request and send them through your Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: MangabaClaw does not write to the Apple Health app. It uses read-only data to create summaries you request and send them through your Gateway to your configured AI provider.
        NSPhotoLibraryUsageDescription: MangabaClaw lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: MangabaClaw uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: MangabaClaw uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        MangabaClawPushMode: "$(MANGABACLAW_PUSH_MODE)"
        MangabaClawPushRelayBaseURL: "$(MANGABACLAW_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  MangabaClawShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: MangabaClawKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(MANGABACLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/MangabaClawShareExtension.entitlements
        CODE_SIGN_STYLE: "$(MANGABACLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        MANGABACLAW_ACTIVE_APP_GROUP_ID: "$(MANGABACLAW_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(MANGABACLAW_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          MANGABACLAW_ACTIVE_APP_GROUP_ID: "$(MANGABACLAW_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: MangabaClaw Share
        CFBundleShortVersionString: "$(MANGABACLAW_MARKETING_VERSION)"
        MangabaClawAppGroupIdentifier: "$(MANGABACLAW_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(MANGABACLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  MangabaClawActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/MangabaClawActivityAttributes.swift
      # Shared continuous avatar waveform; dependency-free for widget isolation.
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/TalkWaveformView.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(MANGABACLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(MANGABACLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(MANGABACLAW_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: MangabaClaw Activity
        CFBundleShortVersionString: "$(MANGABACLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(MANGABACLAW_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MangabaClawWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
      # Universal talk waveform, compiled directly to keep the watch styling local.
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/TalkWaveformView.swift
        group: Shared
      # Universal mascot, compiled directly to keep the watch styling local.
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/MangabaClawMascotView.swift
        group: Shared
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/MangabaClawMascotAnimator.swift
        group: Shared
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/MangabaClawMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: MangabaClawKit
        product: MangabaClawKit
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(MANGABACLAW_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(MANGABACLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(MANGABACLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        MANGABACLAW_COMPANION_APP_BUNDLE_ID: "$(MANGABACLAW_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(MANGABACLAW_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          MANGABACLAW_COMPANION_APP_BUNDLE_ID: "$(MANGABACLAW_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: MangabaClaw
        CFBundleShortVersionString: "$(MANGABACLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(MANGABACLAW_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(MANGABACLAW_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: MangabaClaw connects this Apple Watch directly to your Gateway on trusted local networks.
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  MangabaClawTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: MangabaClaw
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(MANGABACLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(MANGABACLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MangabaClaw.app/MangabaClaw"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(MANGABACLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(MANGABACLAW_BUILD_VERSION)"

  MangabaClawLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: ShareExtension/ShareDraftComposer.swift
        group: ShareExtension
      - path: ShareExtension/ShareContentExtractor.swift
        group: ShareExtension
      - path: ShareExtension/ShareComposeState.swift
        group: ShareExtension
      - path: ShareExtension/ShareAttachmentSummary.swift
        group: ShareExtension
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchInboxMessages.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchMascot.swift
        group: WatchApp/Sources
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/MangabaClawMascotView.swift
        group: Shared
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/MangabaClawMascotAnimator.swift
        group: Shared
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/MangabaClawMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/MangabaClawKit/Sources/MangabaClawChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
    dependencies:
      - package: MangabaClawKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(MANGABACLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(MANGABACLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(MANGABACLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(MANGABACLAW_BUILD_VERSION)"

  MangabaClawUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: MangabaClaw
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(MANGABACLAW_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(MANGABACLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(MANGABACLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: MangabaClaw
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(MANGABACLAW_DEBUG_APP_BUNDLE_ID).ui-tests"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: MangabaClawUITests
        CFBundleShortVersionString: "$(MANGABACLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(MANGABACLAW_BUILD_VERSION)"
