title: "Runtime tool fixture — edit"

scenario:
  id: runtime-tool-edit
  surface: runtime-tools
  runtimePairLane: core
  coverage:
    secondary:
      - agent-runtime.tool-edit
  objective: Verify targeted edit behavior is tracked across MangabaClaw and Codex while Codex owns edit natively.
  successCriteria:
    - MangabaClaw may expose MangabaClaw edit while Codex app-server mode may omit duplicate MangabaClaw dynamic edit.
    - Mock provider edit plans are reported as fixture intent, not as actual runtime tool calls.
    - The row stays report-only until the fixture validates native Codex edit behavior directly.
  docsRefs:
    - qa/scenarios/index.yaml
  codeRefs:
    - src/agents/agent-tools.ts
    - extensions/qa-lab/src/runtime-tool-fixture.ts
  execution:
    kind: flow
    summary: Exercise the edit runtime tool family.
    config:
      toolName: edit
      toolCoverage:
        family: edit
        actualTool: edit
        bucket: codex-native-workspace
        expectedLayer: codex-native-workspace
        required: false
        tracking: "#80319"
        codexDefaultImpact: P4
        qaImpact: P1
        action: split native edit behavior from MangabaClaw dynamic tool parity
        reason: Codex app-server intentionally owns edit natively; the fixture must not require MangabaClaw dynamic edit exposure.
      knownHarnessGap:
        issue: "#80319"
        reason: QA tool-defaults currently needs native edit behavior coverage instead of MangabaClaw dynamic edit exposure.
      promptSnippet: "target=edit"
      failurePromptSnippet: "failure target=edit"

flow:
  steps:
    - name: exercises edit happy and failure paths
      actions:
        - call: runRuntimeToolFixture
          saveAs: result
          args:
            - ref: env
            - ref: config
      detailsExpr: result
