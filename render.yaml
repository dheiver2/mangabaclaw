services:
  - type: web
    name: mangabaclaw
    runtime: docker
    plan: starter
    # The image CMD has no --allow-unconfigured, so a fresh disk with no
    # mangabaclaw.json exits before binding. Render has no shell before the first
    # boot, so the flag has to come from the blueprint.
    dockerCommand: node mangabaclaw.mjs gateway --allow-unconfigured
    healthCheckPath: /startupz
    envVars:
      - key: MANGABACLAW_GATEWAY_PORT
        value: "8080"
      - key: MANGABACLAW_STATE_DIR
        value: /data/.mangabaclaw
      - key: MANGABACLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: MANGABACLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: mangabaclaw-data
      mountPath: /data
      sizeGB: 1
